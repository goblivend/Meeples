<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutant Meeples Game</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <!-- Server Configuration Popup -->
    <div id="serverConfigModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Server Configuration</h3>
            <form id="serverConfigForm">
                <label for="serverUrlInput">Server URL:</label>
                <input type="url" id="serverUrlInput" name="serverUrlInput" required>
                <br>
                <div class="modal-buttons">
                    <button type="submit">Connect</button>
                    <button type="button" id="useDefaultUrl">Use Default</button>
                </div>
            </form>
        </div>
    </div>

    <div
        style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1400px; margin: 20px 0;">
        <h1 style="margin: 0;">Mutant Meeples Game</h1>
        <button id="settingsButton" class="settings-btn" title="Server Settings">⚙️ Settings</button>
    </div>

    <div style="display: flex;">
        <div style="flex: 1; margin: 20px 20px; ">
            <h2>Connect to Game</h2>
            <form id="connectForm">
                <label for="gameId">Game ID:</label>
                <input type="text" id="gameId" name="gameId" required>
                <br>
                <label for="userName">User Name:</label>
                <input type="text" id="userName" name="userName" required>
                <br>
                <button type="submit">Connect</button>
                <p id="connectError" style="color: red;"></p>
            </form>

            <h2>Create a New Game</h2>
            <form id="createForm">
                <label for="newRoomName">Room Name:</label>
                <input type="text" id="newRoomName" name="newRoomName" required>
                <br>
                <button type="submit">Create Game</button>
            </form>

            <form id="HelloWorldForm">
                <h2>Test Hello Endpoint</h2>
                <button type="button" id="helloButton">Call Hello World</button>
                <p id="helloResult"></p>
            </form>
        </div>

        <div style="flex: 1; margin-left: 20px;">
            <h2>Available Games</h2>
            <button id="updateGames">Update Available Games</button>
            <ul id="gamesList"></ul>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
